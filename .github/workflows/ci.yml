name: CI
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - run: npm run check
      - name: Build and verify native Windows capture helper
        if: runner.os == 'Windows'
        shell: powershell
        run: powershell.exe -NoProfile -ExecutionPolicy Bypass -File scripts/build-native.ps1
      - run: npm test
        env:
          NETWATCH_REQUIRE_NATIVE_TEST: ${{ runner.os == 'Windows' && '1' || '' }}
  portable-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Build portable package with verified official runtime
        shell: powershell
        run: powershell.exe -NoProfile -ExecutionPolicy Bypass -File scripts/package-windows.ps1 -OutputFile "$env:RUNNER_TEMP\codex-netwatch-windows-x64.zip"
      - name: Verify tray lifecycle and ownership isolation
        run: node desktop/smoke.mjs
      - uses: actions/upload-artifact@v6
        with:
          name: codex-netwatch-windows-x64
          path: ${{ runner.temp }}/codex-netwatch-windows-x64.zip
          if-no-files-found: error
          retention-days: 7
